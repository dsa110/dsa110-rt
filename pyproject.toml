[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsart"
version = "0.0.1"
description = "DSA-110 real-time FRB search pipeline (Python/CUDA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4,<5",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2",
  "grpcio>=1.50",
  "etcd3>=0.12,<1",
  "pyuvdata>=2.4",
  "numba>=0.57",
  "h5py>=3.8",
  "astropy>=5.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

# M4a chunk 4: _recv_ring C extension is declared in setup.py because
# pyproject.toml does not support ext_modules directly via setuptools.
# See setup.py at repo root.
