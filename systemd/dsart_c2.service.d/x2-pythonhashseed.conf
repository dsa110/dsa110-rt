# x2 (docs/x2/SPEC.md §10): stable str hashing in C2. The 1x trigger packet's
# trigger_class_id is hash(class name) & 0xFFFF (coincidencer.py), which
# changes on every restart unless PYTHONHASHSEED is fixed -- and an op-point
# switch restarts C2. (The 2x CutoutRequest uses crc32 instead.)
#
# Install (h23, at a checkpoint; takes effect at the next C2 restart):
#   cp systemd/dsart_c2.service.d/x2-pythonhashseed.conf \
#      ~/.config/systemd/user/dsart_c2.service.d/
#   systemctl --user daemon-reload
[Service]
Environment=PYTHONHASHSEED=0
