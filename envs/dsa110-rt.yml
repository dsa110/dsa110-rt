# Conda env for DSA110 real-time pipeline (plan section 6 / 6.1 / 6.2).
# Install on h01 after the pre-M0 NVIDIA driver bump (≥ 520) per section 6.2.
# Triton is pulled in via the PyTorch conda package (distribution name torchtriton).
name: dsa110-rt
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python >=3.11,<3.12
  - pip

  # PyTorch 2.x + CUDA 11.8 wheels (cu118); driver ≥ 520 required (section 6.2).
  - pytorch::pytorch >=2.1,<3
  - pytorch::pytorch-cuda=11.8

  - pyuvdata
  - numba
  - h5py
  - numpy
  - scipy
  - astropy
  - pyyaml
  - pandas
  - grpcio
  - protobuf

  - pytest
  - ruff
  - mypy
  - ipython

  - pip:
      # cupy for CUDA 11.x (pairs with CUDA 11.8 user-space from the torch stack above).
      - cupy-cuda11x
      # etcd3 API client used by tooling (distinct from etcd server).
      - etcd3 >=0.12,<1
      # PSRDADA Python bindings; requires site libpsrdada headers/libs at pip install time.
      - psrdada @ git+https://github.com/TRASAL/psrdada-python.git
      # Observatory dsautils (dsa_store, dsa_logging, …). PyPI ``dsautils`` is unrelated; file:// is the h01 checkout dir ``dsa110-pyutils`` (import name remains ``dsautils``).
      - dsautils @ file:///home/ubuntu/proj/dsa110-shell/dsa110-pyutils
