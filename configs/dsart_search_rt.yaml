# dsart-rt search-node pipeline config — pushed to etcd under
# /cnf/search_rt by tools/ops/push_dsart_to_etcd.py and consumed at
# runtime by services/dsart_rt.py (`-in search_rt`).
#
# Search nodes have NO PSRDADA buffers in the M4a transport contract —
# the search-RX writes directly into a POSIX-shm SPMC sparse ring
# (src/dsart/transport/recv_ring.c + production_rx_ring.py) and the
# search-compute halves attach to that ring. So 'buffers:' is empty by
# design; recv_ring is created/torn-down inside the search-rx process
# itself (M4a chunk 4 ownership), not by dsart_rt's dada_db setup.
#
# Schema parity with dsart_pipeline_rt.yaml is preserved so the same
# dsart_rt.py orchestrator binary handles both instances.
schema_version: 1

# No mode switch for search — the search-side wire format is always
# the M4a prod-frame UDP regardless of whether the corr senders are
# in junkdb or real mode. Synthetic search-side load tests (M7.2)
# instead use bench/net_pair.py as the TX side, with the real search-rx
# binary as the RX side; we don't fork the search-side pipeline graph.

buffers: []

# Per-node substitution conventions (dsart_rt._substitute):
#   CN     -> cn_id integer (1 / 2 / 9 / 13 for the four search nodes).
#   CALSB  -> "sb%02d" of the corr chgroup; UNUSED here (search nodes
#             have no chgroup). Don't reference it from search args.
#   CHGROUP -> chgroup index 0..15; ALSO unused here.
# Per-host overrides via the `hostargs:` block pick up first by FQDN
# (n01.pro.pvt) then bare short hostname (n01).

routines:
  # ---- search_rx (M4a chunk 6 + M7.2 ring publish) -----------------
  # Long-running C-epoll fan-in. Binds 16 UDP ports (6625..6640 = one
  # per corr chgroup) on the node's nic.search address, drains each
  # via a single epoll pthread, reassembles fragmented prod_frames and
  # publishes reassembled cube slots into a POSIX-shm SPMC ring named
  # /dsart-rxring-<cn_id> (e.g. /dsart-rxring-1 on n01). The two
  # search_compute halves attach to this same ring as read-only
  # consumers (n_filled, t_buf_samples, bytes_per_cell must match
  # exactly between owner and consumer or the ctypes header check
  # rejects at attach time).
  #
  # Op-point (M7.2 production): n_corr=16, n_coarse_dm=8,
  # bytes_per_cell=2 (cint8 complex), t_buf_samples=4096 (~16 cube
  # cadences of headroom — safe for a momentary compute-half stall).
  #
  # SO_RCVBUF=256 MiB matches corner_turn.sh and the M7.PREP socket
  # buffer note (/proc/sys/net/core/rmem_max must be ≥ 268435456 on
  # the search nodes; M7.0 ops bootstrap raises it).
  #
  # The pattern_id table is intentionally omitted for M7.2; the smoke
  # uses bench/net_pair.py as TX, which emits a known constant
  # pattern_id per chgroup, but we run with no expected_pattern_id
  # registered so every frame is accepted. Production M7.4+ will load
  # a JSON file via --pattern-id-file.
  - name: search_rx
    cmd: python
    args: >-
      -u -m dsart.services.search_rx
      --port-base 6625 --n-ports 16
      --so-rcvbuf-bytes 268435456
      --shm-name /dsart-rxring-CN
      --n-corr 16 --n-coarse-dm 8
      --t-buf-samples 4096 --n-filled 5000
      --bytes-per-cell 2
      --status-interval-s 5.0
      --log-level INFO
    # Hostargs lookup tries the FQDN first, then the bare short hostname
    # (dsart_rt.py:571). In the production lab `socket.gethostname()`
    # returns `lxd110h<NN>` (the kernel-level container name), NOT the
    # operator-facing `n<NN>` alias. We list BOTH forms so the yaml
    # works in either case — the lab one is the path that actually
    # matches today (verified on n01.pro.pvt 2026-05-17, M7.2.8 prep);
    # the `n<NN>` keys are kept as future-proofing in case a node ever
    # gets its kernel hostname renamed to the short alias.
    hostargs:
      lxd110h01: --bind-host 10.41.0.205
      lxd110h02: --bind-host 10.41.0.222
      lxd110h09: --bind-host 10.41.0.253
      lxd110h13: --bind-host 10.41.0.238
      n01: --bind-host 10.41.0.205
      n02: --bind-host 10.41.0.222
      n09: --bind-host 10.41.0.253
      n13: --bind-host 10.41.0.238

  # ---- search_compute x 2 (one per GPU half) -----------------------
  # Both halves attach the SAME ring (read-only) and process the same
  # cube slots, but each one runs the detector on a disjoint slice of
  # fine-DM trials from the shared v2 DM plan. In M7.2-low on n01:
  #   half 0 owns coarse_dm index 0  -> K=34 fine rows
  #   half 1 owns coarse_dm index 1  -> K=34 fine rows
  # (M7.2-high uses owners 6 and 7).
  #
  # M7.2.8 flipped to PRODUCTION GPU op-point (user-clarified
  # 2026-05-18): both halves pinned to cuda:0 / cuda:1,
  # image_backend=gpu. The prior 89cb1bc commit had this on CPU with
  # the comment "search nodes don't yet have a GPU pinned" — that was
  # wrong; n01 (and the other 3 search nodes) each have 2 × RTX 2080 Ti
  # (cuda:0, cuda:1, 11 GB each). The point of M7.2.8 is to verify the
  # search-side GPU pipeline keeps real-time at production op-point on
  # synthetic data, analogous to how M7.1 validated the corr-side
  # GPU pipeline on dada_junkdb data.
  #
  # Production op-point:
  #   n_grid=256, n_fdm=34 (K = N_fine/8 from v2 plan), t_det=256,
  #   cube_cadence_samples=128 (= 134.218 ms / cube = 7.45 cubes/s RT)
  #   t_int_search_us=1048.576 (matches corr t_int_fast at 32x native)
  #
  # The two halves run as independent processes so a crash in one
  # doesn't take down the other; dsart_rt restarts them on the
  # `start` verb. Each writes its own stderr log under
  # ~/tmp/dsart-rt/search_rt-<cn_id>-search_compute_{0,1}.log.
  #
  # M6 sub-systems (clusterer, cube_dump, udp_listener, cands_logger)
  # are all gated OFF for M7.2 — they land in M7.3 along with the
  # full 16x4 fleet bring-up.
  - name: search_compute_0
    cmd: python
    args: >-
      -u -m dsart.services.search_compute
      --shm-name /dsart-rxring-CN
      --n-corr 16 --n-coarse-dm 8
      --t-buf-samples 4096 --n-filled 5000
      --bytes-per-cell 2
      --n-fdm 34 --t-det 256 --n-grid 256
      --cube-cadence-samples 128
      --t-int-search-us 1048.576
      --dm-plan-path /home/ubuntu/data/dm_plans/dm_plan_N8_dmmin100_tol1.6_v2.npz
      --fan-in-min-corrs 15
      --coarse-dm-owners-half-0 0
      --coarse-dm-owners-half-1 1
      --gpu-half 0 --search-node-id CN
      --device cuda:0 --image-backend gpu
      --detector-streaming-tile-size 256
      --detector-streaming-decoder-n-top 24
      --detector-boxcar-accum-dtype fp16
      --detector-layer2-max-samples 100000
      --detector-k-img unit
      --detector-k-dm d1
      --detector-k-time b1,b2,b4,b8,b16,b32,b64
      --layer1-max-samples 25000
      --poll-interval-s 0.001
      --max-cubes 0
      --log-level INFO
    env:
      # M7.1 convention: pin physical GPU via CUDA_VISIBLE_DEVICES,
      # always pass --device cuda:0 (the post-mask logical device).
      # half 0 → physical GPU 0.
      CUDA_VISIBLE_DEVICES: "0"

  - name: search_compute_1
    cmd: python
    args: >-
      -u -m dsart.services.search_compute
      --shm-name /dsart-rxring-CN
      --n-corr 16 --n-coarse-dm 8
      --t-buf-samples 4096 --n-filled 5000
      --bytes-per-cell 2
      --n-fdm 34 --t-det 256 --n-grid 256
      --cube-cadence-samples 128
      --t-int-search-us 1048.576
      --dm-plan-path /home/ubuntu/data/dm_plans/dm_plan_N8_dmmin100_tol1.6_v2.npz
      --fan-in-min-corrs 15
      --coarse-dm-owners-half-0 0
      --coarse-dm-owners-half-1 1
      --gpu-half 1 --search-node-id CN
      --device cuda:0 --image-backend gpu
      --detector-streaming-tile-size 256
      --detector-streaming-decoder-n-top 24
      --detector-boxcar-accum-dtype fp16
      --detector-layer2-max-samples 100000
      --detector-k-img unit
      --detector-k-dm d1
      --detector-k-time b1,b2,b4,b8,b16,b32,b64
      --layer1-max-samples 25000
      --poll-interval-s 0.001
      --max-cubes 0
      --log-level INFO
    env:
      # half 1 → physical GPU 1 (logical cuda:0 inside this process).
      CUDA_VISIBLE_DEVICES: "1"
