# Phase-A/B host identity + transport overrides (§6.2).
#
# This file is the single source of truth for which DSA-110 LXD host the
# dsart pipeline is running on and what role / transport bindings apply.
# It is loaded by dsart.common.host at module-import time; importing dsart
# on a host whose hostname is not listed below will raise KeyError.
#
# Placeholder fields (`tbd`, 127.0.0.1) are intentional — operations needs
# to land per-node decisions before they become real values:
#
#   role             -> "corr" | "search" | "both"
#                       Phase-A development on h01 used "both"; production
#                       fan-out will split corr vs search per the channel
#                       group assignment in configs/chgroup_assignment.yaml.
#
#   gpu_share_mode   -> "mps" | "time_slice"
#                       Pinned by bench/derisk/gpu_share_jitter.py on h01
#                       in M0; rerun on each node before flipping from tbd.
#
#   transport_*_addr -> The high-speed data plane lives on the `br2` bridge
#                       (10.41.0.0/24, MTU 9000) and has NO DNS. The mgmt
#                       `.pro.pvt` names resolve only to br1 (10.42.0.0/24,
#                       MTU 1500), which is too slow for the M4a/M4b path.
#                       For production each host's transport_*_addr must
#                       be the 10.41.0.x address from its own br2 interface
#                       (use `ip -br addr show br2 | awk '{print $3}'`).
#                       127.0.0.1 here is a single-host development default.
#
#   bench_chgroup    -> Sub-band index used by bench/m3_emit_m5_fixtures.py
#                       and friends; defaults to 0 (first sub-band).
#
#   corr_id, search_id
#                    -> Two-digit string identifier matching the lxd110hNN
#                       suffix. Used by transport headers and metric labels.
#
# Adding a new node:
#   1. Append a `lxd110hNN:` block matching the schema below.
#   2. Either set DSART_CONFIG_DIR to a per-host override directory, or
#      land a PR with the real role / gpu_share_mode / transport addrs.

schema_version: 1
hosts:
  lxd110h01:
    phase: phase_a
    role: tbd  # corr | search | both — finalize with ops (dev co-resident uses both services regardless)
    gpu_share_mode: tbd  # mps | time_slice — pinned by bench/derisk/gpu_share_jitter.py on h01 in M0
    co_resident_corr_search: true
    transport_target_addr: 127.0.0.1
    transport_listen_addr: 127.0.0.1
    bench_chgroup: 0
    corr_id: "01"
    search_id: "01"

