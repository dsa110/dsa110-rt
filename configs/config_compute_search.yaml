# Search detector + cube assembly defaults (§9 O-4). M6 chunk 0
# retired the M5 trigger emitter; cluster + cube-dump + UDP-listener
# config keys land in M6 chunks 1-5.
schema_version: 1
dm_plan_path: configs/dm_plan.npz
detector_class: dsart.detector.forward.DeterministicDetector
detector:
  threshold_sigma: 8
  k_img: 4
  k_dm: 4
  k_time: 8
  kernel_dtype: fp16
  k_time_widths: [1, 2, 4, 8, 16, 32, 64, 128]
cube:
  t_det_blocks: 2
  block_samples_search: 256
noise:
  layer1_n_burnin_cubes: 5
  layer2_tau_s: 30
  layer2_n_burnin: 30
decoder:
  merge_radius_lm: 3
  merge_radius_fdm: 5
  merge_radius_t: max_time_kernel_width
