      - [8, 12]
  - search_id: 2
    dm_idx_range_canonical: [12, 17]
    dm_idx_range_consumed: [11, 18]
    per_gpu_canonical:
      - [12, 14]
      - [15, 17]
    per_gpu_consumed:
      - [11, 15]
      - [14, 18]
