# NUMA / GPU / NIC canonical bindings (§6.1) with per-host overrides (§6.2).
schema_version: 1
hosts:
  h22:
    role_template: corr
    notes: >-
      Prototypical corr node (§6.1). CPU ranges verified against `lscpu` on
      n03 (2 sockets x 10 cores x 2 threads = 40 logical): NUMA 0 = 0-9,20-29
      and NUMA 1 = 10-19,30-39 (NOT a contiguous 0-15/16-31 split).
    numa:
      "0":
        cpus: "0-9,20-29"
        dram_gb: 96
      "1":
        cpus: "10-19,30-39"
        dram_gb: 96
    gpu:
      slow:
        device_id: 0
        numa_node: 0
        canonical_role: corr_slow_compute
      fast:
        device_id: 1
        numa_node: 1
        canonical_role: corr_fast_compute
    service_pinning:
      # Consumed as documentation only; dsart_rt does not auto-apply this --
      # the taskset mask is baked into each routine's `cmd` in
      # configs/dsart_pipeline_rt.yaml. corr_slow holds NUMA-0 4-5,24-25;
      # corr_fast is NUMA 1; merge is -c 12 (NUMA 1).
      meridian_fringestop:
        numa_node: 0                 # co-located with the bada ring + corr_slow writer
        cpu_affinity: "8-9,28-29"     # 2 phys cores + HT siblings, away from corr_slow/capture
        notes: casa38 process; sole bada reader (replaces bada_drain).
    nic:
      snap:
        - iface: eth_snap0
          numa_node: 0
        - iface: eth_snap1
          numa_node: 0
      search:
        iface: eth_search40
        numa_node: 1
        mtu: 9000
    sysctl_profile: tools/ops/sysctl.sh
  h13:
    role_template: search
    notes: Prototypical search node (§6.1).
    numa:
      "0":
        cpus: "0-15"
        dram_gb: 96
      "1":
        cpus: "16-31"
        dram_gb: 96
    gpu:
      search0:
        device_id: 0
        numa_node: 0
      search1:
        device_id: 1
        numa_node: 1
    nic:
      search:
        iface: eth_search40
        numa_node: 1
        mtu: 9000
  lxd110h01:
    phase_a_role: co_resident_corr_search   # see configs/host_phase.yaml
    sockets: 2
    cores_per_socket: 10
    threads_per_core: 2
    total_logical_cpus: 40
    numa_nodes:
      node0:
        cpulist: "0-9,20-29"
        mem_kb: 48080952
        gpus: ["0000:3b:00.0"]
        nics: ["eno1", "eno2"]                 # 1/10GbE mgmt; not used for ingest
      node1:
        cpulist: "10-19,30-39"
        mem_kb: 49518084
        gpus: ["0000:af:00.0"]
        nics: ["enp129s0f0", "enp129s0f1"]     # 100GbE Mellanox; idle in Phase A (PSRDADA replay)
    cuda_device_map:                            # set CUDA_DEVICE_ORDER=PCI_BUS_ID in service env
      0: "0000:3b:00.0"                         # CUDA :0 -> NUMA 0
      1: "0000:af:00.0"                         # CUDA :1 -> NUMA 1
    gpu_share_mode: tbd                         # M0 derisk bench/derisk/gpu_share_jitter.py decides MPS vs time-slice
    service_pinning:                            # consumed by services/systemd/templates/* via CPUAffinity=
      dsart-corr-fast@01:
        numa_node: 0
        cpu_affinity: "0-3,20-23"               # 4 phys cores + HT siblings (8 logical)
        cuda_device: 0
      dsart-corr-slow@01:
        numa_node: 0
        cpu_affinity: "4-5,24-25"               # 2 phys cores + HT siblings (4 logical, ~1 Hz cadence)
        cuda_device: 0
      dsart-search-compute@01-0:
        numa_node: 0
        cpu_affinity: "6-9,26-29"               # 4 phys cores + HT siblings (8 logical), shares GPU 0
        cuda_device: 0
      dsart-search-compute@01-1:
        numa_node: 1
        cpu_affinity: "10-19,30-39"             # entire NUMA 1 (20 logical), sole occupant of GPU 1
        cuda_device: 1
    notes:
      - "Phase A: NIC NUMA affinity is irrelevant — corr ingest is via PSRDADA replay, not Mellanox."
      - "Mellanox (NUMA 1) + GPU 0 (NUMA 0) is cross-NUMA; verify production corr-nodes pair NIC+GPU on same node."
      - "GPU enumeration uses CUDA_DEVICE_ORDER=PCI_BUS_ID for deterministic mapping (set in service env)."
