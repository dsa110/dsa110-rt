# Corr-node PSRDADA buffers + capture/corr routine wiring (§6.1, §3.4).
#
# Buffer sizes are PHYSICS-PINNED by the legacy block layout, not config
# choices.  A future implementer who edits these without changing the
# block layout will break either dsaX_merge (fada writer), corr_slow
# (bada writer), or meridian_fringestop (bada reader).
#
#   dada bytes_per_block = NPACKETS_PER_BLOCK × NANTS_PER_SNAP_PAIR
#                          × NCHAN_PER_PACKET × 2 t × 2 pol × 1 byte
#                        = 2048 × 48 × 384 × 2 × 2 × 1
#                        = 150,994,944  (==144 MiB)         capture
#   eada bytes_per_block = same as dada (second SNAP pair)
#                        = 150,994,944  (==144 MiB)         capture
#   fada bytes_per_block = NPACKETS_PER_BLOCK × NANTS × NCHAN_PER_PACKET
#                          × 2 t × 2 pol × 1 byte (4-bit cplx packed)
#                        = 2048 × 96 × 384 × 2 × 2 × 1
#                        = 301,989,888  (==288 MiB)         merged voltage
#   bada bytes_per_block = NBASE × NCHAN_PER_PACKET × 2 pol × 8 byte
#                          (complex64 = float32 + float32; D8/F12)
#                        = 4656 × 384 × 2 × 8
#                        =  28,606,464  (==27.28 MiB)       slow visibilities
#
# fada multi-reader (num_readers=2) is for {corr_slow, corr_fast} attached
# to the same fada ring; bada num_readers=1 = meridian_fringestop only
# (M2 v1; M3 may add a sink reader for diagnostic taps).
#
# num_blocks values mirror legacy production sizing: 70 fada blocks =
# ≈ 9.4 s of voltage history at native cadence (134 ms/block); 300 bada
# blocks = ≈ 40 s of slow-vis history. dada/eada at 20 = ≈ 2.7 s
# capture history.
schema_version: 1
buffers:
  dada:
    key: dada
    bytes_per_block: 150994944
    num_blocks: 20
    num_readers: 1
    numa_cluster: 0
  eada:
    key: eada
    bytes_per_block: 150994944
    num_blocks: 20
    num_readers: 1
    numa_cluster: 1
  fada:
    key: fada
    bytes_per_block: 301989888
    num_blocks: 70
    num_readers: 2
    numa_cluster: 1
  bada:
    key: bada
    bytes_per_block: 28606464
    num_blocks: 300
    num_readers: 1
    numa_cluster: 0
capture:
  snap_udp_ports: [4011, 4012]
merge:
  executable_hint: dsaX_merge
slow_vis:
  service_module: dsart.services.corr_slow_compute
fast_vis:
  service_module: dsart.services.corr_fast_compute
