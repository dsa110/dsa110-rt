# dsart-rt corr-node pipeline config — pushed to etcd under
# /cnf/pipeline_rt by tools/ops/push_dsart_to_etcd.py and consumed at
# runtime by services/dsart_rt.py (`-in pipeline_rt`).
#
# Schema mirrors the legacy /cnf/pipeline (corr.py-compatible) so the
# routine substitution + spawn semantics stay identical to the existing
# operator workflow. The two key differences vs legacy are:
#
#   1. The 'captures.mode' switch lets a corr node feed the fada chain
#      from synthetic data (dada_junkdb) instead of the real SNAP
#      capture binary. This is what the M7.1 / M7.3 stages of the on-sky
#      bring-up use (production-rate plumbing without a telescope).
#
#   2. fada is multi-reader (r=2) so slow- and fast-corr can attach to
#      the same ring without copying. The legacy /cnf/pipeline does the
#      same; called out here because new readers (a diagnostic tap, for
#      example) MUST bump r before being added.
#
# Buffer byte/block math is physics-pinned by the legacy block layout —
# see configs/config_corr.yaml comments for the derivation. Do NOT edit
# without also editing the consumer services.
schema_version: 1

# captures.mode is the M7 stage switch:
#   junkdb  → spawn dada_junkdb x2 (fills dada+eada with /dev/urandom at
#             native cadence; used by M7.1/M7.3 plumbing stages).
#   real    → spawn dsaX_capture_manythread x2 (live SNAP UDP capture;
#             used by M7.5/M7.6 on-sky stages).
# M7.0 ships both routine sets but the captures.mode flag is consulted
# by dsart_rt._select_routines() before spawning.
captures:
  # Production: live SNAP UDP capture via dsart_capture_manythread.
  # M7.4 noise test used mode `synth_fada` (bench/replay_voltage_dump
  # --synthesize → fada). Flip back to `synth_fada` for repeatable
  # pure-Gaussian validation without on-sky data.
  # `replay_burst` is the M7.4 burst-correctness mode: bench/
  # replay_voltage_dump --run-id 250924mptq → fada. Loops the 15-block
  # burst capture indefinitely so a soak picks the burst up multiple
  # times. Default stays at `real` (production SNAP); operators flip
  # to `replay_burst` via local edit + ``push_dsart_to_etcd.py`` when
  # they need to repeat the M7.4 burst correctness check.
  mode: real

buffers:
  - {k: dada, b: 150994944, n: 20,  c: 1, r: 1}   # 144 MiB x 20 = 2.7 s capture history (NUMA 0)
  - {k: eada, b: 150994944, n: 20,  c: 1, r: 1}   # 144 MiB x 20 = 2.7 s capture history (NUMA 1)
  - {k: fada, b: 301989888, n: 70,  c: 1, r: 2}   # 288 MiB x 70 = 9.4 s merged voltage (slow + fast both read)
  - {k: bada, b:  28606464, n: 300, c: 1, r: 1}   # 27.3 MiB x 300 = 40 s slow-vis (meridian_fringestop reads)

routines:
  # ---- captures (mode-gated) ---------------------------------------
  # dada_junkdb usage (verified against the installed binary on n06,
  # /usr/local/bin/dada_junkdb): positional arg is a PSRDADA ASCII
  # header file (NOT a data source); -g is a flag for gaussian
  # distribution (not a path); -r is MB/s; -t seconds. The legacy
  # correlator_header_dsaX.txt under dsa110-xengine/src/ is byte-shape
  # compatible with the dada/eada blocks. M0.sh::[plumbing_junkdb]
  # uses this same header for the same role.
  - name: cap_a_junkdb
    when: captures.mode == junkdb
    cmd: /usr/local/bin/dada_junkdb
    # -r 1073 MiB/s = 144 MiB / 134.218 ms = EXACT native cadence. Note
    # that dada_junkdb's -r flag is MiB/s (binary; `rate_base=1024*1024`
    # in dada_junkdb.c:391) despite the help text saying "MB/s" — we
    # had been using -r 1200 (= 12 % over native), which built spurious
    # queue depth in dada/eada and was implicated in the M7.1 5-min
    # soak hang where merge stopped advancing fada at ~3 min.
    # -t 86400: transfer_size = 86400 × 1.125 GB/s = ~97 TB of bytes
    # to write before junkdb exits (= ~24 h at native cadence). Plenty
    # of headroom for any 60-min soak; orchestrator still kills with
    # SIGTERM on `stop` verb well before then.
    # -g = gaussian-distributed payload (flag, no value).
    # -z = PSRDADA zero-copy direct shm write — avoids the user-buffer
    # → ring-buffer memcpy that the default path does, giving merge a
    # cleaner producer in the multi-reader (r=2) fada → corr_slow +
    # corr_fast topology.
    #
    # NO gate_on_paths (M7.4 Phase 8b, 2026-05-29 — reverts the M7.2
    # gating). junkdb is the head of the fada-chain writer (junkdb ->
    # dada/eada header -> dsaX_merge -> fada header -> corr_fast.Reader
    # (fada)), so gating it on the corr ready-sentinels deadlocks the
    # same way cap_a_real did (corr_fast can't reach ready without the
    # header; the header can't arrive until junkdb runs; junkdb won't
    # run until corr_fast is ready). The M7.2 gate only "worked" for
    # junkdb because the 240 s gate-timeout force-spawned it anyway —
    # i.e. it cost 240 s of dead time and still produced the very
    # ring-fill transient it was meant to avoid. The fill is harmless
    # for junkdb (a synthetic generator has no real SNAP packets to
    # drop; back-pressure just throttles the generator) and is the
    # cosmetic warmup transient noted below; the kernel-warmup pass in
    # corr_fast/corr_slow keeps the steady state clean.
    args: -k dada -r 1073 -t 86400 -g -z /home/ubuntu/proj/dsa110-shell/dsa110-xengine/src/correlator_header_dsaX.txt
  - name: cap_b_junkdb
    when: captures.mode == junkdb
    cmd: /usr/local/bin/dada_junkdb
    args: -k eada -r 1073 -t 86400 -g -z /home/ubuntu/proj/dsa110-shell/dsa110-xengine/src/correlator_header_dsaX.txt

  # ---- synth_fada (M7.4 noise test) ---------------------------------
  # The legacy /usr/local/bin/dada_junkdb has a known bug: its gaussian
  # writer only branches on nbit ∈ {8, 32} (see dada_junkdb.c:266-279).
  # Our pipeline runs at nbit=4 (packed int4 complex voltages), so the
  # `-g` flag is effectively a no-op and the dada/eada buffers receive
  # only the zero-initialised user buffer. With zeros into corr_fast,
  # the gridder + dedispersion produce zero cubes, sigma_l1 floors at
  # 5e-3, and no C1 candidates fire. This mode bypasses the broken
  # junkdb + dsaX_merge plumbing and uses bench/replay_voltage_dump.py
  # in --synthesize mode, which generates properly-packed 4-bit
  # gaussian voltages in the FADA layout
  # (NPACKETS=2048, NANTS=96, NCHAN=384, 2t, NPOL=2) and writes them
  # straight to fada. corr_slow + corr_fast each remain a passive fada
  # reader. --synth-thermal-sigma=1.5 sits comfortably in the [-8,7]
  # int4 range (5σ headroom). --n-blocks=400000 gives ~14.9 h before
  # the writer exits; the orchestrator SIGTERMs well before then on
  # the stop verb.
  - name: cap_synth_fada
    when: captures.mode == synth_fada
    cmd: /home/ubuntu/miniforge3/envs/dsa110-rt/bin/python
    args: -u -m bench.replay_voltage_dump --synthesize --n-blocks 400000 --synth-thermal-sigma 1.5 --fada-key fada
    env:
      PYTHONPATH: /home/ubuntu/proj/dsa110-rt
    # NOTE: no gate_on_paths here. cap_synth_fada is the sole fada
    # writer in this mode and provides the PSRDADA header that
    # corr_fast.getHeader() blocks on; gating on the corr_fast ready
    # sentinel would deadlock (corr_fast can't reach ready without a
    # header, and the header only arrives once cap_synth_fada starts).
    # Back-pressure is naturally bounded by fada n=70 buffers ≈ 9.4 s
    # and PSRDADA flow control.

  # ---- replay_burst (M7.4 burst correctness mode) --------------------
  # Reads the 250924mptq voltage dump (15 native blocks ~ 2 s) and
  # writes them straight into fada via bench/replay_voltage_dump.py in
  # manifest mode. Per-node chgroup is set via the CHGROUP substitution
  # token (n03→0, n04→1, …, n22→15). DSART_VOLTAGE_FIXTURE_ROOT points
  # at the on-node 250924mptq fixture tree (manifest.yaml +
  # fl_burst_chgroup<g>.out symlink pointing at the actual
  # 250924mptq_sb<g>_data.out file).
  #
  # 2026-05-27 (M7.4): --repeat-fixture 1 (single pass, the
  # replay_voltage_dump default). The earlier looped mode (--repeat-
  # fixture 0) was useful for soaks but created a "burst at the same
  # signal-time over and over" pathology that, combined with the now-
  # fixed graph leak + mjd_at_specnum_0=0 anchor bug, produced an
  # immortal C2 cluster firing thousands of stale-specnum dumps. A
  # single pass exercises C1 emit → C2 cluster → broadcast → cube
  # dump → plot generation end-to-end; the corr fleet re-arms via
  # dsart_rt's reap loop if more passes are needed.
  - name: cap_replay_burst
    when: captures.mode == replay_burst
    cmd: /home/ubuntu/miniforge3/envs/dsa110-rt/bin/python
    args: -u -m bench.replay_voltage_dump --run-id 250924mptq --fada-key fada --rate native --chgroups CHGROUP --repeat-fixture 1
    env:
      PYTHONPATH: /home/ubuntu/proj/dsa110-rt
      DSART_VOLTAGE_FIXTURE_ROOT: /home/ubuntu/data/voltages

  # Vendored dsart capture binary (built by setup.py build_ext, lives
  # inside the dsa110-rt package tree). Improvements vs upstream
  # legacy dsaX_capture_manythread: recvmmsg(64) batch receive,
  # deterministic arming (no auto-arm: requires explicit etcd
  # utc_start verb), explicit SO_RCVBUF=256 MiB, POSIX-shm mon
  # publisher consumed by capture_control sidecar. See
  # src/dsart/capture/README.md for the full diff vs upstream.
  #
  # The `-p` flag selects the SNAP-side UDP data port; -k selects the
  # PSRDADA output key (dada / eada). -q is optional; if unset the
  # binary defaults to 11223 for dPort=4011 and 11224 for dPort=4012
  # (matches the legacy convention dsart_rt._send_utc_udp targets).
  #
  # Per-host -j <DATA_IP>:
  #   The SNAP UDP datagrams arrive on enp129s0f0 of each corr node.
  #   The legacy default ("-j" unset -> bind to 127.0.0.1) is fine for
  #   loopback smoke tests but produces silent zero-packet capture on
  #   live SNAPs (observed n06 2026-05-20: cap binary up, shm armed,
  #   n_recv_packets=0 for the entire soak because INADDR_LOOPBACK
  #   doesn't pick up traffic destined for the 100GbE interface).
  #   We use the per-host `hostargs:` mechanism (see search_rt.yaml
  #   bind-host example) to pin the right NIC IP without parameterising
  #   the YAML via tokens. IPs verified live on each node 2026-05-20.
  #
  # NO gate_on_paths on cap_a_real / cap_b_real. (M7.4 Phase 8b,
  # 2026-05-29 — reverts the Phase 8 gating from 2026-05-28.)
  #
  # The Phase 8 change gated real capture on the corr_fast / corr_slow
  # ready-sentinels to chase a fada nfull=68/70 reading. That gating
  # DEADLOCKS real mode, for exactly the reason the synth_fada block
  # above (see "NOTE: no gate_on_paths here") documents: cap_a_real is
  # the head of the only chain that produces the PSRDADA *header* that
  # corr_fast's Reader(fada) blocks on at init:
  #     cap_a_real -> dada header -> dsaX_merge -> fada header
  #         -> corr_fast.Reader(fada) unblocks -> warmup -> ready sentinel
  # Gating cap_a_real on the corr ready-sentinels makes corr_fast wait
  # for a header that can only come once cap_a_real runs, which only
  # runs once corr_fast is ready: a hard deadlock (observed 2026-05-29
  # fleet-wide — merge + corr_fast both parked in do_semtimedop, gate
  # timed out at 300 s, capture force-spawned but still WAITING_FOR_ARM
  # so no header was ever written).
  #
  # The fada nfull=68/70 cold-start fill that Phase 8 tried to fix is
  # instead solved at the source by the kernel-warmup pass added to
  # corr_fast_integration.py / corr_slow_compute.py: both consumers
  # JIT-compile their GPU kernels on dummy blocks BEFORE touching the
  # ready sentinel, so by the time the operator issues utc_start (which
  # is the real "data starts flowing" signal — capture writes only the
  # header on start, no data blocks until armed) the consumers are
  # already at steady-state speed and drain fada from the first block.
  # Verified on-sky 2026-05-29 (n04): n_dropped_kernel=0, 7.4 blocks/s,
  # fada backlog (n_written - n_read) ~0-1 from the first armed block.
  - name: cap_a_real
    when: captures.mode == real
    cmd: /home/ubuntu/proj/dsa110-rt/src/dsart/capture/dsart_capture_manythread
    args: -o dada -p 4011    # SNAP UDP port 0 of this corr's pair (configs/config_corr.yaml capture.snap_udp_ports[0])
    hostargs:
      lxd110h03: -j 10.41.0.224
      lxd110h04: -j 10.41.0.138
      lxd110h05: -j 10.41.0.206
      lxd110h06: -j 10.41.0.203
      lxd110h07: -j 10.41.0.208
      lxd110h08: -j 10.41.0.209
      lxd110h10: -j 10.41.0.211
      lxd110h11: -j 10.41.0.216
      lxd110h12: -j 10.41.0.218
      lxd110h14: -j 10.41.0.212
      lxd110h15: -j 10.41.0.223
      lxd110h16: -j 10.41.0.220
      lxd110h18: -j 10.41.0.228
      lxd110h19: -j 10.41.0.227
      lxd110h21: -j 10.41.0.250
      lxd110h22: -j 10.41.0.233
  - name: cap_b_real
    when: captures.mode == real
    cmd: /home/ubuntu/proj/dsa110-rt/src/dsart/capture/dsart_capture_manythread
    args: -o eada -p 4012    # SNAP UDP port 1 (snap_udp_ports[1])
    # NO gate_on_paths — see cap_a_real above (deadlock; warmup solves fill).
    hostargs:
      lxd110h03: -j 10.41.0.224
      lxd110h04: -j 10.41.0.138
      lxd110h05: -j 10.41.0.206
      lxd110h06: -j 10.41.0.203
      lxd110h07: -j 10.41.0.208
      lxd110h08: -j 10.41.0.209
      lxd110h10: -j 10.41.0.211
      lxd110h11: -j 10.41.0.216
      lxd110h12: -j 10.41.0.218
      lxd110h14: -j 10.41.0.212
      lxd110h15: -j 10.41.0.223
      lxd110h16: -j 10.41.0.220
      lxd110h18: -j 10.41.0.228
      lxd110h19: -j 10.41.0.227
      lxd110h21: -j 10.41.0.250
      lxd110h22: -j 10.41.0.233

  # Mon-publisher sidecar -- snapshots the POSIX-shm segments the two
  # capture binaries publish, pushes into etcd at
  # /mon/corr_rt/CN/capture/<port>. Active in both `real` (production)
  # and `junkdb` (synthetic) modes -- in junkdb mode the shm doesn't
  # exist and the sidecar publishes a single 'shm_status: missing'
  # placeholder lane per port, so the dashboard surface stays stable
  # across captures.mode flips.
  - name: capture_control
    cmd: python
    args: -u -m dsart.services.capture_control --udp-ports 4011,4012 --cn-id CN --log-level INFO

  # ---- merge (always on; reads dada+eada -> writes fada) ------------
  # dsaX_merge reads dada+eada and writes fada (the merged-voltage
  # ring that both corr_slow and corr_fast consume). -m enables
  # multithread write. -c pins to a core; we pick CPU 12 (NUMA 1) so
  # the merge isn't competing with corr_fast (NUMA 1 GPU 1 = CUDA :1)
  # for cache, but is on the same NUMA node as fada (per
  # configs/config_corr.yaml: fada.numa_cluster = 1).
  # `merge` runs only in `real` and `junkdb` modes -- the modes that
  # actually fill dada/eada via the capture binaries. In synth_fada
  # and replay_burst the writers target fada directly so merge would
  # produce a fada double-writer race; we omit it. The when-predicate
  # parser only supports ==/!=, so two clones (one per mode) is the
  # simplest way to express the OR.
  - name: merge_real
    when: captures.mode == real
    cmd: /home/ubuntu/proj/dsa110-shell/dsa110-xengine/src/dsaX_merge
    args: -i dada -j eada -o fada -m -c 12
  - name: merge_junkdb
    when: captures.mode == junkdb
    cmd: /home/ubuntu/proj/dsa110-shell/dsa110-xengine/src/dsaX_merge
    args: -i dada -j eada -o fada -m -c 12

  # ---- corr_slow (M2; reads fada -> writes bada) -------------------
  # Production runs WITHOUT cal apply (slow-vis are emitted uncalibrated
  # so meridian_fringestop / downstream pipelines can derive their own
  # cal). Pinned to GPU 0 via CUDA_VISIBLE_DEVICES (see M7.1 lessons-
  # learned below; without per-process GPU isolation the corr_slow +
  # corr_fast pair hits a Triton "context is destroyed" race).
  - name: corr_slow
    cmd: python
    args: -u -m dsart.services.corr_slow_compute --fada-key fada --bada-key bada --device cuda:0 --log-level INFO --ready-sentinel-path /tmp/dsart-corr-slow-CN.ready
    env:
      CUDA_VISIBLE_DEVICES: "0"

  # ---- meridian_fringestop (M7.4 Phase 9; reads bada -> UVH5) ------
  # The legacy slow-vis fringe-stopper, run UNMODIFIED from the casa38
  # env (dsamfs / dsa110-meridian-fs) via the operator-side wrapper
  # tools/ops/meridian_fringestop_rt.py. It is the SINGLE bada reader
  # (option A): it REPLACES the old `bada_drain` stand-in. bada is r:1,
  # so corr_slow's back-pressure chain is held open by meridian itself.
  #
  # bada (300 buffers ~= 40 s of slow-vis) gives meridian ~40 s of
  # headroom to absorb hdf5 file-close jitter; legacy sustained this
  # cadence. CAUTION: dsart_rt does NOT auto-restart routines, so if
  # meridian crashes corr_slow fills bada and deadlocks at the 301st
  # write within ~40 s -- back-pressuring merge and stalling corr_fast
  # (the M7.1/n06 deadlock). Watch /mon/corr_rt/<cn>/meridian_ready
  # (the wrapper's heartbeat) and re-issue `start` to recover. The old
  # dada_dbnull/dada_drain drain-of-last-resort is intentionally gone:
  # legacy also ran meridian as the de-facto sole consumer.
  #
  # Env: casa38 python (cannot import dsart). taskset pins to NUMA 0
  # cores 8-9,28-29 -- same socket as bada + corr_slow (NUMA 0 =
  # 0-9,20-29 per lscpu on the corr nodes; corr_slow holds 4-5,24-25,
  # corr_fast is on NUMA 1), away from capture/corr_slow. CUSTOMDEC is
  # substituted by dsart_rt with the observing dec at `start`; the
  # wrapper snaps it to the 0.25 deg fstable-cache grid and pins
  # dsamfs.get_pointing_declination to the snapped value so the cached
  # table (built per-dec by tools/build_fstable_cache.py --from-etcd)
  # is a guaranteed hit. PREREQUISITE: the fstable cache must exist at
  # /home/ubuntu/data/fstables for the observing dec, else the wrapper
  # fails fast with the exact build command (no silent slow regen).
  - name: meridian_fringestop
    cmd: taskset
    args: -c 8-9,28-29 /home/ubuntu/anaconda3/envs/casa38/bin/python -u /home/ubuntu/proj/dsa110-rt/tools/ops/meridian_fringestop_rt.py --cn-id CN --pt-dec-deg CUSTOMDEC --fstable-cache /home/ubuntu/data/fstables --working-dir /home/ubuntu/data --output-dir /home/ubuntu/data --log-level INFO

  # ---- corr_fast (M3 production integration; reads fada -> TX) -----
  # Uses the FULL M3 integration shell (RFI flagger + cal + GEMM +
  # static-sky + multi-DM-trial coarse-DM dedispersion + gridder +
  # transport TX into the void).
  #
  # Op-point: REALTIME-FEASIBLE x32 integration (vs the production
  # x8 used in earlier benches). At x8 the 2080Ti was not quite
  # sustaining block cadence — every 4 blocks the gridder + dedisp
  # would slip ~10-20 ms. x32 (1048.576 µs cadence; 4× longer
  # integration) cuts the fast-vis tile count from 512/block to
  # 128/block, dropping the gridder+dedisp work by ~4×. The matching
  # coarse-DM trial count drops from 24 → 5 (band-local Δdm step
  # scales linearly with t_int_fast, so we need ~4× fewer trials to
  # cover the same DM range at the same smearing tolerance). With
  # chan_sum_factor=8 (production F33) + sliding-window (production
  # F34) this op-point sustains realtime with comfortable headroom
  # on a single 2080Ti.
  #
  # Per-node cal blob: each corr node applies its OWN local
  # `antennas.out` — the legacy x-engine beamformer-weights binary the
  # upstream cal pipeline (calibration23 / update_bfweights.py) writes
  # to `~/proj/dsa110-shell/dsa110-xengine/utils/antennas.out` on every
  # corr node. Because the file is already node-local (it carries that
  # node's own subband solution), the path is identical on all 16 corr
  # nodes and needs no CALSB substitution. The blob is the same legacy
  # format `dsart.cal.bf_weights.load_bf_weights` reads (the old
  # `beamformer_weights_sb<NN>.dat` files were this same format), so the
  # fast-corr cal loader consumes it unchanged. Hot-reload via
  # `cmd: reload_cal`. (CALSB is still substituted by dsart_rt for any
  # other per-node args that want it; it is just no longer used here.)
  #
  # GPU isolation: CUDA_VISIBLE_DEVICES=1 hides GPU 0 from this
  # process; the post-mask logical device 0 == physical GPU 1, which
  # is the NUMA-1 GPU paired with fada (configs/config_corr.yaml::
  # fada.numa_cluster = 1). Without this mask, simultaneous Triton
  # JIT in corr_fast + corr_slow on the same node crashes one of
  # them with "Triton Error [CUDA]: context is destroyed" — see
  # M7-1-REPORT.md for the bisect.
  # Option A (2026-06-03): corr-side stage-2 inter-chgroup alignment
  # FIFO is enabled via --stage2-mode per_coarse_dm below. Each chgroup
  # applies a per-coarse-DM integer-sample delay
  # (Δτ(ν_bot_proc, ν_chgroup_TOP[g], coarse_dm)) so the wire-frame data
  # is already aligned to ν_bot_proc at the search receiver. Pairs with
  # the search side dropping --include-coarse-offset-in-search-shifts
  # (default include_coarse_offset=False; see dsart_search_rt.yaml).
  # Per-chgroup FIFO depth ≤ 11 cubes worst case (chgroup-0 at DM=2500);
  # steady-state per-cube cost ≈ 1 ms (<1% of 130 ms budget); per-node
  # FIFO memory peaks at ~1.1 GiB on chgroup-0. NB: comments MUST live
  # outside the args: >- folded scalar (`#` characters inside it become
  # literal argv tokens that argparse rejects — see 2026-06-03 incident).
  - name: corr_fast
    cmd: python
    args: >-
      -u -m dsart.services.corr_fast_integration
      --fada-key fada
      --chgroup CHGROUP
      --obs-dec-deg CUSTOMDEC
      --device cuda:0
      --apply-cal /home/ubuntu/proj/dsa110-shell/dsa110-xengine/utils/antennas.out
      --cal-mode phase_only
      --flagants /home/ubuntu/data/voltages/250924mptq/cals/flagants.dat
      --sk-far 1e-4
      --bandpass-k 5.0
      --group-k 5.0
      --sumthr-max-m 8
      --sumthr-eta 1.5
      --rfi-m-values 64,256,1024,4096
      --t-int-fast-native 32
      --dm-plan-path /home/ubuntu/data/dm_plans/dm_plan_N8_dmmin100_tol1.6_v2.npz
      --chan-sum-factor 8
      --sliding-window
      --n-grid 256
      --transport-tx-mode prod
      --transport-tx-workers 4
      --transport-tx-host 10.41.0.205
      --transport-tx-base-port 6625
      --transport-tx-coarse-dm-mask 0xFF
      --transport-tx-worker-hosts 10.41.0.205,10.41.0.222,10.41.0.253,10.41.0.238
      --stage2-mode per_coarse_dm
      --max-blocks 0
      --output-dir /home/ubuntu/tmp/dsart-fast-grid
      --blocks-output-mode none
      --log-level INFO
      --ready-sentinel-path /tmp/dsart-corr-fast-CN.ready
      --rfi-mon-cn-id CN
      --rfi-mon-window-size 16
      --rfi-mon-freq-downsample 4
      --rfi-mon-shm-slots 64
      --inject-watch
    env:
      CUDA_VISIBLE_DEVICES: "1"

  # M7.6 RFI monitor exporter sidecar. Sibling of corr_fast — reads
  # the 16-cube window shm /dev/shm/dsart-rfi-window-CN that
  # corr_fast_integration publishes, exposes it over HTTP on port
  # 5780 (h23 dashboard pulls), and pushes the scalar window
  # summary to etcd at /mon/corr_rt/CN/rfi every 2 s.
  #
  # Lifecycle: starts whenever corr_fast does; safe to start even
  # when the shm isn't there yet (it retries every cadence). No GPU
  # usage; no CUDA_VISIBLE_DEVICES setting.
  - name: rfi_monitor_export
    cmd: python
    args: >-
      -u -m dsart.services.rfi_monitor_export
      --cn-id CN
      --etcd-cadence-s 2.0
      --staleness-s 10.0
      --http-bind 0.0.0.0
      --http-port 5780
      --log-level INFO
